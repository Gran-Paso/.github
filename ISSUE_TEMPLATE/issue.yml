name: Issue Gran Paso
description: Reportar bug, feature o tarea en el ERP
title: "[area] Descripción breve"
labels: ["P2-media"]
body:
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - P0-stopper
        - P1-alta
        - P2-media
        - P3-baja
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Módulo afectado
      options:
        - area:inventario
        - area:ventas
        - area:crm
        - area:servicios
        - area:factory
        - area:expenses
        - area:hr
        - area:shop
        - area:auth
        - area:api
        - area:infra
        - area:ui
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Producción
        - Desarrollo
        - Local
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      placeholder: Qué pasa hoy
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      placeholder: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Ir a...\n2. Click en..."
  - type: input
    id: business_id
    attributes:
      label: business_id (si aplica)
      placeholder: "ej: 12"
